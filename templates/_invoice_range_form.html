<form method="post" action="{{ url_for('invoices.preview') }}" class="form-stack" data-invoice-range-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Client<span class="select-control"><select name="client_id" required data-invoice-client><option value="">Select a client</option>{% for client in clients %}<option value="{{ client.id }}" {% if draft.get('client_id')|string == client.id|string %}selected{% endif %}>{{ client.name }}</option>{% endfor %}</select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></span></label>
  <label>Contract<span class="select-control"><select name="contract_id" required data-invoice-project><option value="">Select a contract</option>{% for project in projects %}<option value="{{ project.id }}" data-client-id="{{ project.client_id }}" {% if draft.get('contract_id')|string == project.id|string %}selected{% endif %}>{{ project.name }}</option>{% endfor %}</select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></span></label>
  <label>Invoice Range<span class="select-control"><select name="mode" data-invoice-mode><option value="since_last" {% if draft.get('mode', 'since_last') == 'since_last' %}selected{% endif %}>Since Last Invoice → Now</option><option value="custom" {% if draft.get('mode') == 'custom' %}selected{% endif %}>Selected Date / Time Range</option></select><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></span></label>
  <div class="form-stack" data-invoice-custom-range>
    <label>Start Date / Time<input type="datetime-local" name="range_start" step="1" max="9999-12-31T23:59:59" value="{{ draft.get('range_start', '') }}"></label>
    <label>End Date / Time<input type="datetime-local" name="range_end" step="1" max="9999-12-31T23:59:59" value="{{ draft.get('range_end', '') }}"></label>
  </div>
  <p class="muted">Times use {{ timezone_name }}. Includes uninvoiced sessions that finished on or after the start and before the end. Running timers are left untouched.</p>
  <div class="form-actions"><a class="button button-secondary" href="{{ url_for('invoices.index') }}">Cancel</a><button class="button button-primary" type="submit"><i class="fa-solid fa-file-invoice" aria-hidden="true"></i> Preview Invoice</button></div>
</form>
