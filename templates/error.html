{% extends "base.html" %}
{% block title %}Error {{ status }} · Grayhaven Systems LLC Time Tracker{% endblock %}
{% block content %}<section class="alert alert-error alert-with-icon error-alert" role="alert"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i><div class="alert-message"><p class="eyebrow">ERROR {{ status }}</p><h1>Unable to Complete the Request</h1><p class="muted">{{ message }}</p><div class="error-actions"><a class="button button-primary" href="{{ url_for('main.dashboard') if logged_user else url_for('main.login') }}">Return to {{ 'Dashboard' if logged_user else 'Sign In' }}</a></div></div></section>{% endblock %}
